<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direction E · Spatial Ski App</title><link rel="stylesheet" href="./shared.css"><style>
:root{--ice:#eef4f2;--ink:#10221c;--muted:#62736c;--surface:#ffffff;--selected:#ef5b3f;--label-bg:#fff;--label-border:#19382d2e;--contour:#315b4d1c;--mountain-fill:#d4e2dc;--ridge:#486f6150;--lift:#dc6048;--beginner:#3b9c60;--intermediate:#2d72b2;--advanced:#173129}body{background:var(--ice);color:var(--ink)}.screen{height:100vh;min-height:690px;position:relative;overflow:hidden}.map-layer{position:absolute;inset:0;padding:80px 38px 34px 160px;background:radial-gradient(circle at 55% 32%,#fff 0,#eef4f2 48%,#e6efeb 100%)}.map-layer .map-host{filter:drop-shadow(0 18px 40px #44605512)}.topbar{position:absolute;z-index:3;top:18px;left:20px;right:20px;display:flex;align-items:center;gap:14px}.logo{height:48px;padding:0 17px;display:flex;align-items:center;background:#10251e;color:#fff;border-radius:16px;font-weight:800;font-size:11px;letter-spacing:.08em;box-shadow:0 8px 28px #17382d20}.command{height:48px;width:min(480px,44vw);display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border:1px solid #1d3b3020;border-radius:16px;box-shadow:0 8px 28px #17382d12}.command b{font-size:17px}.command input{flex:1;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink)}.top-spacer{flex:1}.pill{height:40px;padding:0 14px;display:flex;align-items:center;border:1px solid #1d3b3028;background:rgba(255,255,255,.86);border-radius:999px;font-size:10px;backdrop-filter:blur(10px)}.left-tools{position:absolute;z-index:3;left:20px;top:86px;width:112px;display:grid;gap:10px}.tool{background:rgba(255,255,255,.88);border:1px solid #1d3b3020;border-radius:16px;padding:13px 12px;box-shadow:0 8px 26px #17382d10;backdrop-filter:blur(8px)}.tool h3{font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}.tool label{display:flex;align-items:center;gap:7px;font-size:10px;margin:8px 0}.tool .line{width:20px;height:3px;border-radius:3px}.line.g{background:#3b9c60}.line.b{background:#2d72b2}.line.k{background:#173129}.zoom{display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden}.zoom button{height:42px;border:0;background:transparent;font-size:18px}.zoom button+button{border-left:1px solid #1d3b3020}.inspector{position:absolute;z-index:3;right:24px;bottom:24px;width:330px;background:rgba(255,255,255,.93);border:1px solid #1d3b3026;border-radius:22px;box-shadow:0 20px 60px #17382d20;backdrop-filter:blur(18px);overflow:hidden}.inspector-head{padding:20px 20px 15px;border-bottom:1px solid #17382d16}.inspector-head small{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#e2543b}.inspector-head h1{font-size:30px;letter-spacing:-.05em;margin:5px 0 6px}.inspector-head p{margin:0;font-size:10px;color:var(--muted)}.metric-grid{display:grid;grid-template-columns:1fr 1fr}.metric{padding:14px 18px;border-bottom:1px solid #17382d12}.metric:nth-child(odd){border-right:1px solid #17382d12}.metric span{display:block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.metric b{display:block;margin-top:5px;font-size:17px}.evidence{padding:13px 18px;display:flex;justify-content:space-between;font-size:10px}.trail-peek{position:absolute;z-index:2;left:168px;bottom:24px;display:flex;gap:8px}.trail-chip{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.84);border:1px solid #1d3b3020;font-size:10px;box-shadow:0 6px 20px #17382d0d}.trail-chip.active{background:#10251e;color:#fff}@media(max-width:780px){.screen{height:auto;min-height:100vh;overflow:auto}.topbar{position:sticky;top:0;padding-top:10px}.logo{display:none}.command{width:100%}.pill{display:none}.left-tools{position:relative;left:auto;top:auto;width:auto;margin:84px 12px 12px;grid-template-columns:1fr 1fr}.map-layer{position:relative;inset:auto;height:520px;padding:18px 0 0}.trail-peek{display:none}.inspector{position:relative;right:auto;bottom:auto;width:auto;margin:12px;border-radius:18px}}
</style></head><body><div class="screen"><div class="map-layer"><div id="map" class="map-host"></div></div><header class="topbar"><div class="logo">SKI TRAIL ATLAS</div><div class="command"><b>⌕</b><input value="B1 · 摇滚" aria-label="Search trails"><span>⌘K</span></div><div class="top-spacer"></div><div class="pill">Fulong · 2025–26</div><div class="pill">EN / 中文</div></header><aside class="left-tools"><section class="tool"><h3>Difficulty</h3><label><i class="line g"></i>Beginner</label><label><i class="line b"></i>Intermediate</label><label><i class="line k"></i>Advanced</label></section><section class="tool zoom"><button>−</button><button>+</button></section></aside><div class="trail-peek"><span class="trail-chip">A1 蓝调</span><span class="trail-chip">A7 节奏布鲁斯</span><span class="trail-chip active">B1 摇滚</span><span class="trail-chip">B13 打击乐</span></div><section class="inspector"><div class="inspector-head"><small>Advanced · selected</small><h1>B1 · 摇滚</h1><p>Source-reported values · structural location unverified</p></div><div class="metric-grid"><div class="metric"><span>Length</span><b>1,557 m</b></div><div class="metric"><span>Average slope</span><b>22°</b></div><div class="metric"><span>Width</span><b>30 m</b></div><div class="metric"><span>Start elevation</span><b>1,565 m</b></div></div><div class="evidence"><span>Evidence · 1 source</span><u>Inspect ↗</u></div></section></div><div class="prototype-note">E · Spatial Ski App</div><script type="module">import{renderMap}from'./map.js';renderMap(document.querySelector('#map'));</script></body></html>
