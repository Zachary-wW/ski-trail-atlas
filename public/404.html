<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting · Fulong Trail Atlas</title>
  </head>
  <body>
    <script>
      (function () {
        var base = "/ski-trail-atlas/";
        var route = window.location.pathname.startsWith(base)
          ? "/" + window.location.pathname.slice(base.length)
          : "/";
        window.location.replace(base + "?route=" + encodeURIComponent(route));
      })();
    </script>
  </body>
</html>
